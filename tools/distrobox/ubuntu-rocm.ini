[ubuntu-rocm]
image=ubuntu:latest
image_name=ubuntu-rocm
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-rocm"

additional_flags=--device /dev/dri --device /dev/kfd -e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY

additional_packages="ca-certificates gnupg"
additional_packages="git wget curl htop iftop iotop zsh cmake byobu"
additional_packages="python3-dev python3-pip python3-venv"

init_hooks="wget https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb"
init_hooks="sudo apt install ./amdgpu-install_7.2.70200-1_all.deb -y"
init_hooks="sudo apt update && sudo apt install rocm -y"

