[ubuntu-rocm-llm]
image=ubuntu:24.04
image_name=ubuntu-rocm-llm
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-rocm-llm"

additional_flags=--device /dev/dri --device /dev/kfd -e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY -e OLLAMA_HOST=0.0.0.0 -e OLLAMA_MAX_VRAM=22528 -e OLLAMA_NUM_PARALLEL=1

additional_packages="ca-certificates gnupg"
additional_packages="nano zstd git wget curl htop zsh cmake byobu usbutils"
additional_packages="python3-dev python3-pip python3-venv"
additional_packages="libssl-dev libffi-dev build-essential"

# Install ROCm (only if not already installed)
init_hooks="dpkg -s amdgpu-install >/dev/null 2>&1 || (wget https://repo.radeon.com/amdgpu-install/7.2.3/ubuntu/noble/amdgpu-install_7.2.3.70203-1_all.deb && sudo apt install ./amdgpu-install_7.2.3.70203-1_all.deb -y && rm ./amdgpu-install_7.2.3.70203-1_all.deb && sudo apt update && sudo apt install rocm -y)"

# Install Ollama (native ROCm/AMD GPU support) (only if not already installed)
init_hooks="command -v ollama >/dev/null 2>&1 || curl -fsSL https://ollama.com/install.sh | sh"

# Install llama-cpp-python with ROCm/HIP backend (only if not already installed)
# --break-system-packages is required on Ubuntu 24.04+ (PEP 668) inside the container
init_hooks="python3 -c 'import llama_cpp' >/dev/null 2>&1 || CMAKE_ARGS='-DGGML_HIPBLAS=on' pip3 install --break-system-packages --no-warn-script-location llama-cpp-python"
