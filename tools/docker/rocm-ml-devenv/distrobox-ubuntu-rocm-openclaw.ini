[ubuntu-rocm-openclaw]
image=ubuntu:24.04
image_name=ubuntu-rocm-openclaw
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-rocm-openclaw"

# OpenClaw devices and variables (No GPU needed if backend is external)
additional_flags=-e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY -e OLLAMA_HOST=host.docker.internal

additional_packages="ca-certificates gnupg"
additional_packages="nano zstd git wget curl htop zsh cmake byobu usbutils"
additional_packages="python3-dev python3-pip python3-venv build-essential"

# Install Node.js (Version 22.x LTS - OpenClaw relies heavily on Node/npm)
init_hooks="command -v node >/dev/null 2>&1 || (curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt-get install -y nodejs)"

# Install OpenClaw globally (only if not already installed)
# Note: init_hooks run as root, so this installs into /usr/bin. 
# You will need to run 'sudo npm update -g openclaw' inside the container to update it later.
init_hooks="command -v openclaw >/dev/null 2>&1 || npm install -g openclaw@latest"
