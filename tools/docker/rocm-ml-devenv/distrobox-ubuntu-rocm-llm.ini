[ubuntu-rocm-llm]
image=ubuntu:24.04
image_name=ubuntu-rocm-llm
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-rocm-llm"

additional_flags=--device /dev/dri --device /dev/kfd -e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY -e OLLAMA_HOST=0.0.0.0

additional_packages="ca-certificates gnupg"
additional_packages="zstd git wget curl htop zsh cmake byobu usbutils"
additional_packages="python3-dev python3-pip python3-venv"
additional_packages="libssl-dev libffi-dev build-essential"

# Install ROCm
init_hooks="wget https://repo.radeon.com/amdgpu-install/7.2.3/ubuntu/noble/amdgpu-install_7.2.3.70203-1_all.deb"
init_hooks="sudo apt install ./amdgpu-install_7.2.3.70203-1_all.deb -y"
init_hooks="sudo apt update && sudo apt install rocm -y"

# Install Ollama (native ROCm/AMD GPU support)
init_hooks="curl -fsSL https://ollama.com/install.sh | sh"

# Install llama-cpp-python with ROCm/HIP backend
# --break-system-packages is required on Ubuntu 24.04+ (PEP 668) inside the container
init_hooks="CMAKE_ARGS='-DGGML_HIPBLAS=on' pip3 install --break-system-packages --no-warn-script-location llama-cpp-python
