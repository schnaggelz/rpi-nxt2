[ubuntu-openclaw]
image=ubuntu:24.04
image_name=ubuntu-openclaw
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-openclaw"

# OpenClaw devices and variables (No GPU needed if backend is external)
additional_flags=-e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY -e OLLAMA_HOST=host.docker.internal

additional_packages="build-essential ca-certificates gnupg"
additional_packages="nano zstd git wget curl htop zsh cmake byobu usbutils"
additional_packages="python3-dev python3-pip python3-venv"
additional_packages="nodejs npm"

# Install Homebrew globally via user 'timon' to bypass root restrictions, then add to path
#init_hooks="if [ ! -d /home/linuxbrew/.linuxbrew ]; then mkdir -p /home/linuxbrew/.linuxbrew && chown -R timon:timon /home/linuxbrew && curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh > /tmp/install_brew.sh && chmod +x /tmp/install_brew.sh && su - timon -c 'NONINTERACTIVE=1 /tmp/install_brew.sh'; fi"
#init_hooks="if [ ! -f /etc/profile.d/brew.sh ]; then /home/linuxbrew/.linuxbrew/bin/brew shellenv > /etc/profile.d/brew.sh && chmod +x /etc/profile.d/brew.sh; fi"

# Install OpenClaw globally
init_hooks="command -v openclaw >/dev/null 2>&1 || npm install -g openclaw@latest"
