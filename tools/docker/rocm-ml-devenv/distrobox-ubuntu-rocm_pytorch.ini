[ubuntu-rocm]
image=ubuntu:24.04
image_name=ubuntu-rocm-pytorch
init_system=true
nvidia=false

home="/home/timon/.distrobox/ubuntu-rocm-pytorch"

additional_flags=--device /dev/dri --device /dev/kfd -e DISPLAY=$DISPLAY -e WAYLAND_DISPLAY=$WAYLAND_DISPLAY

additional_packages="ca-certificates gnupg"
additional_packages="nano zstd git wget curl htop iftop iotop zsh cmake byobu usbutils"
additional_packages="python3-dev python3-pip python3-venv"

init_hooks="wget https://repo.radeon.com/amdgpu-install/7.2.3/ubuntu/noble/amdgpu-install_7.2.3.70203-1_all.deb"
init_hooks="sudo apt install ./amdgpu-install_7.2.3.70203-1_all.deb -y"
init_hooks="sudo apt update && sudo apt install rocm -y"

# Install PyTorch with ROCm 7.2 (nightly) + extras
# --break-system-packages is required on Ubuntu 24.04+ (PEP 668) inside the container
init_hooks="pip3 install --break-system-packages --upgrade pip wheel setuptools"
init_hooks="pip3 install --break-system-packages --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/rocm7.2"
init_hooks="pip3 install --break-system-packages onnxscript onnx onnxsim"

